services:
  db:
    image: postgis/postgis:16-3.5
    environment:
      POSTGRES_DB: lake
      POSTGRES_PASSWORD: lake
      POSTGRES_USER: lake
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lake -d lake']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '5432:5432'
    volumes:
      - lake-postgres-data:/var/lib/postgresql/data

volumes:
  lake-postgres-data:
